include themes/Argonaut.conf

font_family      Iosevka Nerd Font Mono
font_size 14.0
tab_bar_edge top

tab_bar_edge top
map kitty_mod+| launch --location=vsplit
map kitty_mod+- launch --location=hsplit
map kitty_mod+h   previous_window

map super+shift+enter new_tab_with_cwd
map super+right        next_tab
map super+left         previous_tab
map super+t       new_tab
map super+c        copy_to_clipboard
map super+v        paste_from_clipboard
copy_on_select yes
enabled_layouts horizontal, vertical, stack, grid
#hide_window_decorations yes
allow_remote_control yes  

# Fix nerd symbols
include font-nerd-symbols.conf

enable_audio_bell no
