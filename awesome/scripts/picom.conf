# picom (compositor) for awesome: rounded corners, soft shadows, short fades,
# and unfocused windows a touch see-through. Started by config/autostart.lua
# (settings.compositor); the main menu can restart it or turn it off.
# picom v12 syntax: later rules override earlier ones.

backend = "glx";
vsync = true;
# a fullscreen game or video skips the compositor entirely: no added latency
unredir-if-possible = true;
use-damage = true;

corner-radius = 8;

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -14;
shadow-offset-y = -14;

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;

rules = (
	# awesome's own windows (bar, popups, menus, notifications, the idle
	# clock): they draw their own shape, so picom doesn't round them
	{ match = "class_g = 'awesome'"; corner-radius = 0; },
	# the bar, the desktop and anything fullscreen: square and no shadow
	{ match = "window_type = 'dock' || window_type = 'desktop' || fullscreen"; corner-radius = 0; shadow = false; },
	# tooltips and dropdown menus from apps: no shadow box around them
	{ match = "window_type = 'tooltip' || window_type = 'dropdown_menu' || window_type = 'popup_menu'"; shadow = false; },
	# unfocused windows slightly see-through, except browsers (video), video
	# players and games
	{
		match = "!focused && !fullscreen && window_type = 'normal' && class_g != 'awesome'"
			" && class_g != 'Brave-browser' && class_g != 'firefox_firefox' && class_g != 'firefox'"
			" && class_g != 'mpv' && class_g != 'vlc' && class_g != 'steam'"
			" && class_g !^= 'steam_app_' && class_g !~= '[.]exe$' && class_g != 'gamescope'";
		opacity = 0.95;
	},
);
